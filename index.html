<!DOCTYPE html>
<html lang="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portfolio de Pierryck Seguela. Création et production de contenus visuels, vidéo et photo." data-i18n="meta.description">
  <meta name="author" content="Pierryck Seguela">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Pierryck Seguela — création et production de contenus visuels" data-i18n="meta.title">
  <meta property="og:description" content="Portfolio de Pierryck Seguela. Création et production de contenus visuels, vidéo et photo." data-i18n="meta.description">
  <meta property="og:image" content="assets/images/og.jpg">
  <title data-i18n="meta.title">Pierryck Seguela — création et production de contenus visuels</title>
  <link rel="icon" href="assets/images/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/images/favicon-192.png">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css?v=29">
</head>
<body>
  <header>
    <nav class="navbar" id="navbar">
      <button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="nav-links" data-i18n-aria="nav.menu">
        <span class="nav-toggle-bar" aria-hidden="true"></span>
        <span class="nav-toggle-bar" aria-hidden="true"></span>
        <span class="nav-toggle-bar" aria-hidden="true"></span>
      </button>
      <ul class="nav-links" id="nav-links">
        <li><a href="#home" data-i18n="nav.home"></a></li>
        <li><a href="#projects" data-i18n="nav.projects"></a></li>
        <li><a href="#contact" data-i18n="nav.contact"></a></li>
      </ul>
      <div class="lang-switcher">
        <button type="button" class="lang-btn" data-lang="en" aria-label="English">EN</button>
        <button type="button" class="lang-btn" data-lang="fr" aria-label="Français">FR</button>
      </div>
    </nav>
  </header>

  <main>
    <section id="home" class="hero">
      <div class="floating-icons" id="floating-icons" aria-hidden="true"></div>
      <div class="hero-layout">
        <div class="hero-content">
          <div class="hero-identity fade-up">
            <span class="gold-bar" aria-hidden="true"></span>
            <div>
              <h1 class="hero-greeting" data-i18n="hero.greeting"></h1>
              <p class="hero-role" data-i18n="hero.role"></p>
            </div>
          </div>
          <p class="hero-kicker fade-up" data-i18n="hero.kicker"></p>
          <p class="hero-field fade-up" data-i18n="hero.field"></p>
          <p class="hero-duration fade-up" data-i18n="hero.duration"></p>
          <p class="hero-location fade-up">
            <i class="fas fa-map-marker-alt" aria-hidden="true"></i>
            <span data-i18n="hero.location"></span>
          </p>
          <div class="hero-ctas fade-up">
            <a href="#projects" class="btn btn-primary"><i class="fas fa-film" aria-hidden="true"></i><span data-i18n="hero.ctaWork"></span></a>
          </div>
        </div>
      </div>
    </section>

    <section id="projects" class="projects">
      <div class="container">
        <h2 class="section-title fade-up" data-i18n="projects.video.title"></h2>
        <div class="home-video-grid fade-up">
          <figure class="home-video">
            <button type="button" class="yt-facade" data-youtube-id="TbWDrskXr5Y" data-i18n-aria="project.paris.title">
              <img src="assets/images/playadz-paris-creator-week.jpg?v=1" alt="" loading="lazy" data-i18n-alt="project.video.parisThumbAlt">
              <span class="yt-facade-play" aria-hidden="true"><i class="fas fa-play"></i></span>
            </button>
            <figcaption>
              <span data-i18n="project.paris.title"></span>
              <span data-i18n="project.paris.kicker"></span>
            </figcaption>
          </figure>
          <figure class="home-video">
            <button type="button" class="yt-facade" data-youtube-id="XF82xJBwU5E" data-i18n-aria="project.streamGratuit.title">
              <img src="assets/images/playadz-tu-stream-gratuitement.jpg?v=2" alt="" loading="lazy" data-i18n-alt="project.video.streamGratuitThumbAlt">
              <span class="yt-facade-play" aria-hidden="true"><i class="fas fa-play"></i></span>
            </button>
            <figcaption>
              <span data-i18n="project.streamGratuit.title"></span>
              <span data-i18n="project.streamGratuit.kicker"></span>
            </figcaption>
          </figure>
          <figure class="home-video">
            <button type="button" class="yt-facade" data-youtube-id="cx7J6Xb1pwU" data-i18n-aria="project.streammates.title">
              <img src="assets/images/playadz-pub-streammates.jpg?v=1" alt="" loading="lazy" data-i18n-alt="project.video.streammatesThumbAlt">
              <span class="yt-facade-play" aria-hidden="true"><i class="fas fa-play"></i></span>
            </button>
            <figcaption>
              <span data-i18n="project.streammates.title"></span>
              <span data-i18n="project.streammates.kicker"></span>
            </figcaption>
          </figure>
          <figure class="home-video">
            <button type="button" class="yt-facade" data-youtube-id="742AkIRGuv8" data-i18n-aria="project.stream.title">
              <img src="assets/images/playadz-pov.jpg?v=1" alt="" loading="lazy" data-i18n-alt="project.video.streamThumbAlt">
              <span class="yt-facade-play" aria-hidden="true"><i class="fas fa-play"></i></span>
            </button>
            <figcaption>
              <span data-i18n="project.stream.title"></span>
              <span data-i18n="project.stream.kicker"></span>
            </figcaption>
          </figure>
        </div>

        <h2 class="section-title fade-up" id="photos" data-i18n="projects.photo.title"></h2>
        <div class="project-photo-grid fade-up">
          <button type="button" class="photo-thumb" data-gallery-index="0">
            <img src="photos/aston-martin.jpg" alt="" data-i18n-alt="projects.photo1Alt">
          </button>
          <button type="button" class="photo-thumb" data-gallery-index="1">
            <img src="photos/packshot.jpg" alt="" data-i18n-alt="projects.photo2Alt">
          </button>
          <button type="button" class="photo-thumb" data-gallery-index="2">
            <img src="photos/facade.jpg" alt="" data-i18n-alt="projects.photo3Alt">
          </button>
          <button type="button" class="photo-thumb" data-gallery-index="3">
            <img src="photos/pont.jpg" alt="" data-i18n-alt="projects.photo4Alt">
          </button>
          <button type="button" class="photo-thumb" data-gallery-index="4">
            <img src="photos/fleur.jpg" alt="" data-i18n-alt="projects.photo6Alt">
          </button>
        </div>
      </div>
    </section>

    <section id="contact" class="contact">
      <div class="container contact-container">
        <h2 class="section-title fade-up" data-i18n="contact.title"></h2>
        <div class="contact-buttons fade-up">
          <a href="mailto:pierryck.seguela@gmail.com" class="btn btn-primary">
            <i class="fas fa-envelope" aria-hidden="true"></i>
            <span data-i18n="contact.email"></span>
          </a>
          <a href="https://www.linkedin.com/in/pierryck-seguela-383839272/" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">
            <i class="fab fa-linkedin-in" aria-hidden="true"></i>
            <span data-i18n="contact.linkedin"></span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p data-i18n="footer.copyright"></p>
  </footer>

  <div class="gallery" id="gallery" hidden>
    <div class="gallery-backdrop" data-gallery-close></div>
    <div class="gallery-dialog" role="dialog" aria-modal="true" aria-labelledby="gallery-title">
      <h2 id="gallery-title" class="visually-hidden"></h2>
      <button type="button" class="gallery-close" data-gallery-close data-i18n-aria="gallery.close">
        <i class="fas fa-times" aria-hidden="true"></i>
      </button>
      <button type="button" class="gallery-nav gallery-prev" data-i18n-aria="gallery.prev">
        <i class="fas fa-chevron-left" aria-hidden="true"></i>
      </button>
      <div class="gallery-stage">
        <img id="gallery-image" alt="">
        <video id="gallery-video" controls playsinline preload="metadata"></video>
      </div>
      <button type="button" class="gallery-nav gallery-next" data-i18n-aria="gallery.next">
        <i class="fas fa-chevron-right" aria-hidden="true"></i>
      </button>
      <p id="gallery-caption" class="gallery-caption"></p>
    </div>
  </div>

  <script src="js/translations.js?v=33"></script>
  <script src="js/main.js?v=25"></script>
</body>
</html>
